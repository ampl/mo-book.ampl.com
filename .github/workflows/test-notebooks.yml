name: Discover and Test Notebooks

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install ruff
      run: pip install ruff==0.16.8

    - name: Check ruff formatting
      run: ruff format --check --diff .

    - name: Check ruff lint
      run: ruff check .

  discover-notebooks:
    runs-on: ubuntu-latest
    outputs:
      notebooks: ${{ steps.set-notebooks.outputs.notebooks }}
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Find notebooks
      id: set-notebooks
      run: |
        echo "📋 Skipped notebooks:"
        python scripts/list_notebooks.py --list-skipped
        echo "▶️ Running tests on:"
        python scripts/list_notebooks.py
        notebooks=$(python scripts/list_notebooks.py --json)
        echo "notebooks=$notebooks" >> $GITHUB_OUTPUT

  test-notebook:
    needs: discover-notebooks
    strategy:
      matrix:
        notebook: ${{ fromJson(needs.discover-notebooks.outputs.notebooks) }}
      fail-fast: false
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      env:
        AMPLKEY_UUID: ${{ secrets.AMPLKEY_UUID }}
      run: |
        python -m pip install --upgrade pip
        pip install nbval==0.11.0 pytest
        pip install amplpy
        python -m amplpy.modules install base
        # Test the AMPL build with the license fingerprint fix
        BASE_DIR=$(python -c "import ampl_module_base, os; print(os.path.dirname(ampl_module_base.__file__))")
        AMPL_BIN=$(dirname "$(find "$BASE_DIR" -type f -name ampl | head -1)")
        echo "Replacing ampl and leasefingerprint in $AMPL_BIN"
        ls -la "$AMPL_BIN"
        curl -fsSL http://portal.ampl.com/dl/tmp/ampl.linux-intel64.20261106.tgz | tar xzf - -C "$AMPL_BIN" ampl leasefingerprint
        ls -la "$AMPL_BIN"
        "$AMPL_BIN/ampl" -vvq
        python -m amplpy.modules activate $AMPLKEY_UUID

    - name: Test notebook ${{ matrix.notebook }}
      run: |
        echo "Testing notebook: ${{ matrix.notebook }}"
        pytest --nbval-lax ${{ matrix.notebook }}
